<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Adaptive Dino Runner</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main id="game-shell">
    <canvas id="gameCanvas"></canvas>
    <div id="ui-overlay" class="visible">
      <div class="home-container">
        <div class="title-section">
          <h1>Duck Duck Jump!</h1>
        </div>
        <div id="color-picker" class="color-picker">
          <p>Choose your color:</p>
          <div class="colors">
            <button class="color-btn" data-color="#ff4b4b" style="background:#ff4b4b"></button>
            <button class="color-btn" data-color="#ff9c42" style="background:#ff9c42"></button>
            <button class="color-btn" data-color="#ffe241" style="background:#ffe241"></button>
            <button class="color-btn" data-color="#3ddc97" style="background:#3ddc97"></button>
            <button class="color-btn" data-color="#4b7bff" style="background:#4b7bff"></button>
            <button class="color-btn" data-color="#9b4bff" style="background:#9b4bff"></button>
          </div>
        </div>
        <button id="start-button" class="primary">Start Run</button>
        <div class="instructions-container">
          <p class="instructions"><strong>↑</strong> or <strong>Space</strong> to Jump and <strong>↓</strong> to Duck</p>
        </div>
      </div>
    </div>
    <div id="reflection-panel" class="hidden">
      <section class="panel">
        <p class="label">Game Over</p>
        <p class="score" id="final-score">0</p>
        <p class="insight" id="insight-text">Practice a little more to see how your playstyle shifts.</p>
        <button id="restart-button" class="primary">Restart</button>
        <button id="home-button" class="primary">Home</button>
      </section>
    </div>
     <button id="pause-button" class="pause-btn hidden">Pause</button>
  </main>
  <script src="game.js"></script>
</body>
</html>
